name: Release verified extension

on:
  workflow_run:
    workflows: [Build and test]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  deployments: write
  actions: read

concurrency:
  group: release-commit-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the validated main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Select validated platform archives
        id: packages
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { selectVsixArtifacts } = await import(require('node:url').pathToFileURL(process.env.GITHUB_WORKSPACE + '/.github/ci/vsix-delivery.ts').href);
            const selected = await selectVsixArtifacts(github, { repository: context.repo, buildRunId: context.payload.workflow_run.id });
            console.log('Validated producer selection:', JSON.stringify(selected));
            core.setOutput('windows', selected.windows.artifactId);
            core.setOutput('linux', selected.linux.artifactId);
      - name: Download the validated Windows archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.packages.outputs.windows }}
          path: ${{ runner.temp }}/windows-vsix
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Download the validated Linux archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.packages.outputs.linux }}
          path: ${{ runner.temp }}/linux-vsix
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Publish the tested bytes and record package availability
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          WINDOWS_ARTIFACT_ID: ${{ steps.packages.outputs.windows }}
          LINUX_ARTIFACT_ID: ${{ steps.packages.outputs.linux }}
          WINDOWS_PACKAGE_DIRECTORY: ${{ runner.temp }}/windows-vsix
          LINUX_PACKAGE_DIRECTORY: ${{ runner.temp }}/linux-vsix
        with:
          script: |
            const { publishVsixDelivery } = await import(require('node:url').pathToFileURL(process.env.GITHUB_WORKSPACE + '/.github/ci/vsix-delivery.ts').href);
            const delivered = await publishVsixDelivery(github, {
              repository: context.repo, buildRunId: context.payload.workflow_run.id,
              windows: { artifactId: Number(process.env.WINDOWS_ARTIFACT_ID), directory: process.env.WINDOWS_PACKAGE_DIRECTORY },
              linux: { artifactId: Number(process.env.LINUX_ARTIFACT_ID), directory: process.env.LINUX_PACKAGE_DIRECTORY },
            });
            core.setOutput('release-url', delivered.releaseUrl);
            await core.summary.addLink('Verified extension package', delivered.releaseUrl).write();
