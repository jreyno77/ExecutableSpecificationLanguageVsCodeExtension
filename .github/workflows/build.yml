name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Select affected tests
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const selected = new Set();
          let all = process.env.GITHUB_EVENT_NAME !== 'pull_request';
          if (!all) {
            const files = execFileSync('git', ['diff', '--name-only', '--no-renames', '-z',
              `${process.env.BASE_SHA}...${process.env.HEAD_SHA}`], { encoding: 'utf8' }).split('\0').filter(Boolean);
            for (const file of files) {
              if (/\.md$/.test(file) || file.startsWith('generation/uml/')) continue;
              if (/^(src\/core\/|generation\/expec\/src\/core\/|test\/(?:unit\/)?core\/|test\/resources\/generation-worker\/|test\/acceptance\/(?:WorkspaceCore|DocumentAnalysis|ConnectionController|OutputPreviews|GenerationOnSave|SourceNavigation)(?:\.|\/))/.test(file)) {
                selected.add('core'); selected.add('editor'); selected.add('ui');
              } else if (/^(src\/vscode\/|generation\/expec\/src\/vscode\/|test\/(?:unit\/|driver\/|resources\/)?vscode\/|test\/acceptance\/(?:EditorAdapter(?:\.|\/)|EditorLanguageSupport\.test\.ts|ConnectionSidebar\.test\.ts|OutputPreviewHost\.test\.ts|GenerationHost\.test\.ts|native-editor\.test\.ts|workspace\.test\.ts))/.test(file)) {
                selected.add('editor');
              } else if (/^(src\/ui\/|generation\/expec\/src\/ui\/|test\/(?:unit\/)?ui\/|test\/acceptance\/OutputTabs(?:\.|\/)|test\/resources\/)/.test(file)) {
                selected.add('ui');
              } else {
                // Shared configuration, DSL/drivers, tooling and unmapped code affect every component.
                all = true;
              }
            }
          }
          const filters = {
            core: ['test/acceptance/ConnectionController', 'test/acceptance/DocumentAnalysis', 'test/acceptance/WorkspaceCore', 'test/acceptance/OutputPreviews', 'test/acceptance/GenerationOnSave', 'test/acceptance/SourceNavigation', 'test/unit/core/', 'test/core/'],
            editor: ['test/acceptance/native-editor.test.ts', 'test/acceptance/EditorAdapter', 'test/acceptance/workspace.test.ts', 'test/unit/vscode/', 'test/vscode/'],
            ui: ['test/acceptance/OutputTabs', 'test/unit/ui/', 'test/ui/'],
          };
          const tests = all || selected.size > 0;
          appendFileSync(process.env.GITHUB_OUTPUT, `tests=${tests}\nnative=${all || selected.has('editor')}\nui=${all || selected.has('ui') || selected.has('editor')}\nfilters=${all ? '' : [...selected].flatMap(part => filters[part]).join(' ')}\n`);
          console.log(all ? 'Full extension suite' : tests ? `Affected components: ${[...selected].join(', ')}` : 'Documentation only; no tests selected');
          NODE
      - name: Install dependencies
        run: |
          npm install --global npm@11.20.0 --ignore-scripts
          npm ci
      - name: Check the specification
        run: npm run spec:check
      - name: Build
        run: npm run build
      - name: Package the extension
        run: npm run package:vsix
      - name: Install Chromium for browser observations
        if: steps.scope.outputs.ui == 'true'
        run: npx --no-install playwright install --with-deps chromium
      - name: Test affected components
        if: steps.scope.outputs.tests == 'true'
        env:
          TEST_FILTERS: ${{ steps.scope.outputs.filters }}
          EXPEC_TEST_VSIX: ${{ github.workspace }}/dist/expec-vscode-extension.vsix
          EXPEC_NATIVE_VSIX_EVIDENCE: ${{ runner.temp }}/expec-installed-vsix.json
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a npm test -- $TEST_FILTERS
          else
            npm test -- $TEST_FILTERS
          fi
      - name: Verify tested VSIX
        env:
          NATIVE_CHECKS: ${{ steps.scope.outputs.native }}
          PLATFORM: ${{ matrix.os }}
          EXPEC_NATIVE_VSIX_EVIDENCE: ${{ runner.temp }}/expec-installed-vsix.json
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const packageName = 'expec-vscode-extension.vsix';
          const finalSha256 = createHash('sha256').update(readFileSync(`dist/${packageName}`)).digest('hex');
          const provenance = { kind: 'validation-only', commit: process.env.GITHUB_SHA,
            run: Number(process.env.GITHUB_RUN_ID), attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            platform: process.env.PLATFORM, package: packageName, finalSha256 };
          if (process.env.NATIVE_CHECKS === 'true') {
            const installed = JSON.parse(readFileSync(process.env.EXPEC_NATIVE_VSIX_EVIDENCE, 'utf8'));
            if (installed.kind !== 'installed-vsix' || installed.nativeHost !== true ||
              [installed.sourceSha256, installed.copiedSha256, installed.postNativeSha256].some(hash => hash !== finalSha256)) {
              throw new Error('Native installation and final package bytes do not agree.');
            }
            Object.assign(provenance, { kind: 'tested-vsix', suppliedSha256: installed.sourceSha256,
              copiedSha256: installed.copiedSha256, postNativeSha256: installed.postNativeSha256 });
          } else if (process.env.GITHUB_EVENT_NAME !== 'pull_request') {
            throw new Error('Main delivery requires actual native installation evidence.');
          }
          writeFileSync('dist/provenance.json', JSON.stringify(provenance) + '\n', { flag: 'wx' });
          console.log(JSON.stringify(provenance));
          NODE
      - name: Upload verified VSIX
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: expec-vsix-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/expec-vscode-extension.vsix
            dist/provenance.json
          if-no-files-found: error
